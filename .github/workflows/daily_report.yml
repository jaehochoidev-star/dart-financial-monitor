name: DART 재무 모니터링

on:
  schedule:
    # 매일 오전 8시 (KST) = UTC 23:00 (전날)
    - cron: "0 23 * * *"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dart-daily-report
  cancel-in-progress: false

jobs:
  dart-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # DART API는 느릴 수 있음
    env:
      TZ: Asia/Seoul
    outputs:
      pages_uploaded: ${{ steps.pages.outcome }}
      pages_artifact_name: ${{ steps.pages_artifact.outputs.name }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Python 설치 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: DART 모니터링 실행
        env:
          DART_API_KEY:       ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python dart_monitor.py

      - name: 결과 엑셀 아티팩트 저장 (90일 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: dart_report_*.xlsx
          retention-days: 90

      - name: 날짜별 기록을 저장소에 보관
        id: archive
        if: ${{ !cancelled() && hashFiles('reports/**/report.json') != '' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Save daily DART report [skip ci]"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: 정적 웹페이지 생성
        id: site
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: python report_archive.py

      - name: 이번 실행의 Pages 아티팩트 이름 지정
        id: pages_artifact
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Pages 아티팩트 업로드
        id: pages
        if: ${{ !cancelled() && steps.pages_artifact.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: site

  deploy:
    needs: dart-monitor
    if: ${{ !cancelled() && needs.dart-monitor.outputs.pages_uploaded == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 웹페이지 배포
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.dart-monitor.outputs.pages_artifact_name }}
